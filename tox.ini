[tox]
envlist = py39, py310, py311, py312, lint, typecheck
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov>=4.0
commands =
    python -m unittest src.test_zloop_engine -v

[testenv:lint]
deps =
    ruff>=0.1.0
commands =
    ruff check src/

[testenv:typecheck]
deps =
    mypy>=1.0
commands =
    mypy src/

[testenv:coverage]
deps =
    pytest>=7.0
    pytest-cov>=4.0
commands =
    pytest src/ --cov=src --cov-report=term-missing --cov-report=html
